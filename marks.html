<!DOCTYPE html>
<html>
<head>
<title>Marks Entry</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sidebar">
    <h2>STUDENT MANAGEMENT SYSTEM</h2>
    <ul>
        <li onclick="window.location.href='dashboard.html'">Dashboard</li>
        <li onclick="window.location.href='student.html'">Student</li>
        <li onclick="window.location.href='attendance.html'">Attendance</li>
        <li onclick="window.location.href='marks.html'">Marks Entry</li>
        <li onclick="window.location.href='result.html'">Result Report</li>
        <li onclick="window.location.href='search.html'">Student Search</li>
        <li onclick="window.location.href='index.html'">Logout</li>
    </ul>
</div>

<div class="main-content">
    <h2>Marks Entry</h2>

    <h3>Add New Subject</h3>
    <label>New Subject Name :</label>
    <input type="text" id="newSubjectInput">
    <button onclick="addSubject()">Add Subject</button>
    <p id="subjectMessage"></p>

    <h3>Enter Marks</h3>
    <label>Student ID :</label>
    <input type="number" id="studentIdInput">

    <label>Subject Name :</label>
    <select id="subjectInput"></select>

    <label>Max Marks :</label>
    <input type="number" id="maxMarksInput">

    <label>Marks Obtained :</label>
    <input type="number" id="obtainedInput">

    <div class="btn-row">
        <button onclick="saveMarks()">Save Marks</button>
        <button onclick="loadMarks()">Load Marks</button>
    </div>

    <h3>Marks List</h3>
    <table id="marksTable">
        <tr>
            <th>Subject</th>
            <th>Max Marks</th>
            <th>Marks Obtained</th>
        </tr>
    </table>
</div>

<script>
const MARKS_API = "https://studentmanagementsystem-kbv3.onrender.com/api/marks";
const SUBJECT_API = "https://studentmanagementsystem-kbv3.onrender.com/api/subjects";

window.onload = loadSubjectDropdown;

function loadSubjectDropdown() {
    fetch(SUBJECT_API)
    .then(res => res.json())
    .then(data => {
        const dropdown = document.getElementById("subjectInput");
        dropdown.innerHTML = "";
        data.forEach(subject => {
            const option = document.createElement("option");
            option.value = subject.subjectName;
            option.innerText = subject.subjectName;
            dropdown.appendChild(option);
        });
    });
}

function addSubject() {
    const subjectName = document.getElementById("newSubjectInput").value.trim();
    if (!subjectName) { alert("Enter a subject name"); return; }

    fetch(SUBJECT_API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ subjectName: subjectName })
    })
    .then(res => res.json())
    .then(result => {
        if (result === "DUPLICATE") {
            document.getElementById("subjectMessage").innerText = "This subject already exists";
        } else {
            document.getElementById("subjectMessage").innerText = "Subject added successfully";
            document.getElementById("newSubjectInput").value = "";
            loadSubjectDropdown();
        }
    });
}

function saveMarks() {
    const studentId = document.getElementById("studentIdInput").value;
    const subjectName = document.getElementById("subjectInput").value;
    const maxMarks = document.getElementById("maxMarksInput").value;
    const marksObtained = document.getElementById("obtainedInput").value;

    fetch(MARKS_API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            subjectName: subjectName,
            maxMarks: maxMarks,
            marksObtained: marksObtained,
            student: { studentId: studentId }
        })
    })
    .then(res => res.json())
    .then(() => loadMarks());
}

function loadMarks() {
    const studentId = document.getElementById("studentIdInput").value;
    if (!studentId) { alert("Enter a Student ID first"); return; }

    fetch(`${MARKS_API}/student/${studentId}`)
    .then(res => res.json())
    .then(data => {
        const table = document.getElementById("marksTable");
        table.innerHTML = "<tr><th>Subject</th><th>Max Marks</th><th>Marks Obtained</th></tr>";
        data.forEach(m => {
            const row = table.insertRow();
            row.innerHTML = `<td>${m.subjectName}</td><td>${m.maxMarks}</td><td>${m.marksObtained}</td>`;
        });
    });
}
</script>

</body>
</html>
