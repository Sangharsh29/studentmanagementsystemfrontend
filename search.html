<!DOCTYPE html>
<html>
<head>
<title>Student Search</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sidebar">
    <h2>STUDENT MANAGEMENT SYSTEM</h2>
    <ul>
        <li onclick="window.location.href='dashboard.html'">Dashboard</li>
        <li onclick="window.location.href='student.html'">Student</li>
        <li onclick="window.location.href='attendance.html'">Attendance</li>
        <li onclick="window.location.href='marks.html'">Marks Entry</li>
        <li onclick="window.location.href='result.html'">Result Report</li>
        <li onclick="window.location.href='search.html'">Student Search</li>
        <li onclick="window.location.href='index.html'">Logout</li>
    </ul>
</div>

<div class="main-content">
    <h2>Student Search</h2>

    <label>Student ID :</label>
    <input type="number" id="searchId">

    <div class="btn-row">
        <button onclick="searchStudent()">Search</button>
    </div>

    <div id="studentDetails"></div>
</div>

<script>
function searchStudent() {
    const id = document.getElementById("searchId").value;
    if (!id) { alert("Enter a Student ID"); return; }

    fetch(`http://localhost:8080/api/students/${id}`)
    .then(res => res.json())
    .then(student => {
        if (!student) {
            document.getElementById("studentDetails").innerHTML = "<p>No student found</p>";
            return;
        }
        document.getElementById("studentDetails").innerHTML = `
            <p><b>Student ID:</b> ${student.studentId}</p>
            <p><b>Name:</b> ${student.name}</p>
            <p><b>Class:</b> ${student.className}</p>
            <p><b>Mobile No:</b> ${student.mobileNo}</p>
            <p><b>Address:</b> ${student.address}</p>
        `;
    });
}
</script>

</body>
</html>
