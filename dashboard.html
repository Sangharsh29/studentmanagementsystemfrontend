<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sidebar">
    <h2>STUDENT MANAGEMENT SYSTEM</h2>
    <ul>
        <li onclick="window.location.href='dashboard.html'">Dashboard</li>
        <li onclick="window.location.href='student.html'">Student</li>
        <li onclick="window.location.href='attendance.html'">Attendance</li>
        <li onclick="window.location.href='marks.html'">Marks Entry</li>
        <li onclick="window.location.href='result.html'">Result Report</li>
        <li onclick="window.location.href='search.html'">Student Search</li>
        <li onclick="window.location.href='index.html'">Logout</li>
    </ul>
</div>

<div class="main-content">
    <h1>Dashboard</h1>
    <div class="cards">
        <div class="card">Total Students<br><span id="totalStudents">--</span></div>
        <div class="card">Today Attendance<br><span id="todayAttendance">--</span></div>
        <div class="card">Total Subjects<br><span id="totalSubjects">--</span></div>
        <div class="card">Total Users<br><span id="totalUsers">--</span></div>
    </div>
</div>

<script>
fetch("http://localhost:8080/api/students")
.then(res => res.json())
.then(data => document.getElementById("totalStudents").innerText = data.length);

fetch("http://localhost:8080/api/subjects")
.then(res => res.json())
.then(data => document.getElementById("totalSubjects").innerText = data.length);

fetch("http://localhost:8080/api/users")
.then(res => res.json())
.then(data => document.getElementById("totalUsers").innerText = data.length);

const today = new Date().toISOString().split("T")[0];
fetch(`http://localhost:8080/api/attendance/date/${today}`)
.then(res => res.json())
.then(data => document.getElementById("todayAttendance").innerText = data.length);
</script>

</body>
</html>
